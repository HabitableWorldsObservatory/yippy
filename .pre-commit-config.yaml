repos:
  - repo: https://github.com/CoreySpohn/hwoutils
    rev: 7ea5d77
    hooks:
      - id: no-internal-refs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: trailing-whitespace
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/(synthetic_yip|sinc_fixture|sinc/(__init__|helpers|reference_reader))\.py$
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.12.0
    hooks:
      - id: pydoclint-flake8
        args:
          - --select=DOC
          - --extend-ignore=DOC106,DOC107,DOC108
          - --style=google
          - --arg-type-hints-in-docstring=False
          - --check-return-types=False
          - --check-yield-types=False
          - --skip-checking-short-docstrings=False
          - --skip-checking-private-functions=True
          - --skip-checking-raises=True
          - --allow-init-docstring=True
          - --check-class-attributes=True
        files: ^src/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
