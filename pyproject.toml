[build-system]
requires = ["hatchling>=1.26.3", "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "yippy"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
description = "A Python and JAX wrapper to create a coronagraph object from a yield input package"
dependencies = [
  "astropy>=6.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "scipy>=1.13",
  "hwoutils>=1.10.0",
  "lod_unit>=1.8.0",
  "tqdm>=4.66.3",
  "jax>=0.8.1",
  "equinox>=0.13.2",
  "interpax>=0.3.12",
  "jaxtyping>=0.3.3",
  "pooch>=1.9.0",
]
license = { file = "LICENSE" }
dynamic = ['readme', 'version']
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.scripts]
yippy-sinc = "yippy.sinc_tools:main"

[project.urls]
Homepage = "https://github.com/HabitableWorldsObservatory/yippy"
Issues = "https://github.com/HabitableWorldsObservatory/yippy/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/yippy/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[project.optional-dependencies]
sinc = ["sinchole>=0.1.0"]
docs = [
  "sphinx>=7.2.6",
  "myst-nb>=1.0.0",
  "sphinx-book-theme>=1.1.0",
  "sphinx-autoapi>=3.0.0",
  "ipython>=8.18.1",
]
test = [
  "pytest>=7.3.2",
  "hypothesis>=6.79.1",
  # The budget plugin needs psutil where process-list commands are unavailable.
  "psutil>=5.9.4",
  "pytest-xdist>=2.5",
  "pytest-testmon>=2.0.7",
  "pytest-markdown-docs>=0.5.0",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
]

# Validation evidence, collected by the ineedvalidation pytest plugin when it
# is installed and ignored when it is not, so this table adds no dependency.
# Each prefix says which physical case a test attests and what kind of evidence
# it produces. Run with --vv-evidence PATH to write the ledger.
[tool.ineedvalidation]
library = "yippy"

[tool.ineedvalidation.defaults]
"tests/test_analytic_yip.py" = { case = "performance-curves", evidence = "code-verification" }
"tests/test_direction_anchor.py" = { case = "psf-synthesis", evidence = "code-verification" }
"tests/test_flux_and_centre.py" = { case = "psf-synthesis", evidence = "code-verification" }
"tests/test_jax_contract.py" = { case = "performance-curves", evidence = "code-verification" }
"tests/test_yip_contract.py" = { case = "coronagraph-table-contract", evidence = "code-verification" }
"tests/test_export_agreement.py" = { case = "yip-export", evidence = "code-verification" }
"tests/test_performance.py" = { case = "performance-curves", evidence = "code-verification" }
"tests/test_fft_interpolation.py" = { case = "psf-synthesis", evidence = "code-verification" }
"tests/test_map_methods.py" = { case = "performance-curves", evidence = "code-verification" }
"tests/test_eqx_coronagraph.py" = { case = "performance-curves", evidence = "code-verification" }
"tests/test_rebinning_metadata.py" = { case = "psf-synthesis", evidence = "code-verification" }
"tests/test_real_psf_transforms.py" = { case = "psf-synthesis", evidence = "code-verification" }
"tests/test_rotation_regressions.py" = { case = "psf-synthesis", evidence = "code-verification" }

[tool.ruff]
exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.isort]
# _version.py is generated during installation and absent in the hygiene job.
known-first-party = ["yippy"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "network: requires network access (skipped by default in CI)",
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]
addopts = "-m 'not network'"

[tool.testbudget]
library = "yippy"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["yippy"]
optional_dependencies_dev_groups = ["docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/yippy"]
